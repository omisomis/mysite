<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visa Application</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      height: 100%;
      background-color: #FFFFFF; /* Exact white to match document */
    }
    
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #FFFFFF; /* White background */
    }
    
    .image-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #FFFFFF; /* White to match document */
      overflow: auto; /* Allow scroll if image is larger than screen */
    }
    
    img {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain; /* Show entire image */
    }
    
    /* Smart scaling based on screen orientation */
    @media (orientation: portrait) {
      /* For portrait screens (most phones) showing portrait documents */
      .image-container {
        align-items: flex-start; /* Start from top for better appearance */
        padding-top: 0;
      }
      
      img {
        width: 100%;
        height: auto;
      }
    }
    
    @media (orientation: landscape) {
      /* For landscape screens showing portrait documents */
      img {
        width: auto;
        height: 100%;
      }
    }
    
    /* Hidden class */
    .hidden {
      display: none !important;
    }
    
    #error {
      color: #000000; /* Black text on white background */
      text-align: center;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background-color: #FFFFFF;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }
    
    #error h1 {
      margin-bottom: 20px;
      font-size: 24px;
    }
    
    #error p {
      font-size: 18px;
      color: #333;
    }
  </style>
</head>
<body>
  <!-- Only ONE of these will be visible at a time -->
  <div id="container1" class="image-container hidden">
    <img id="img1" src="images/document1.jpg" alt="Document 1" onload="centerImage(this)">
  </div>
  
  <div id="container2" class="image-container hidden">
    <img id="img2" src="images/document2.jpg" alt="Document 2" onload="centerImage(this)">
  </div>
  
  <div id="container3" class="image-container hidden">
    <img id="img3" src="images/document3.jpg" alt="Document 3" onload="centerImage(this)">
  </div>
  
  <!-- Error message (hidden by default) -->
  <div id="error" class="hidden">
    <h1>Invalid Document Request</h1>
    <p>Use: ?id=doc1 or ?id=doc2 or ?id=doc3</p>
  </div>

  <script>
    // Function to perfectly center the image
    function centerImage(img) {
      const container = img.parentElement;
      const imgRatio = img.naturalWidth / img.naturalHeight;
      const containerRatio = container.clientWidth / container.clientHeight;
      
      // If image is narrower than container (relative to height)
      if (imgRatio < containerRatio) {
        // Image is more portrait than container
        img.style.width = '100%';
        img.style.height = 'auto';
        
        // Center vertically if there's space
        if (img.clientHeight < container.clientHeight) {
          container.style.alignItems = 'center';
        } else {
          container.style.alignItems = 'flex-start';
        }
      } else {
        // Image is more landscape than container
        img.style.width = 'auto';
        img.style.height = '100%';
        
        // Center horizontally if there's space
        if (img.clientWidth < container.clientWidth) {
          container.style.justifyContent = 'center';
        } else {
          container.style.justifyContent = 'flex-start';
        }
      }
    }
    
    // Get the ID parameter from the URL
    const url = new URL(window.location.href);
    const id = url.searchParams.get('id');
    
    // Hide ALL containers first
    document.getElementById('container1').classList.add('hidden');
    document.getElementById('container2').classList.add('hidden');
    document.getElementById('container3').classList.add('hidden');
    document.getElementById('error').classList.add('hidden');
    
    // Show only the selected one
    if (id === 'doc1') {
      const container = document.getElementById('container1');
      const img = document.getElementById('img1');
      container.classList.remove('hidden');
      
      // If image is already loaded, center it
      if (img.complete) {
        centerImage(img);
      }
      
    } else if (id === 'doc2') {
      const container = document.getElementById('container2');
      const img = document.getElementById('img2');
      container.classList.remove('hidden');
      
      if (img.complete) {
        centerImage(img);
      }
      
    } else if (id === 'doc3') {
      const container = document.getElementById('container3');
      const img = document.getElementById('img3');
      container.classList.remove('hidden');
      
      if (img.complete) {
        centerImage(img);
      }
      
    } else {
      // Show error if no valid ID
      document.getElementById('error').classList.remove('hidden');
    }
    
    // Handle window resize
    window.addEventListener('resize', function() {
      const visibleContainers = document.querySelectorAll('.image-container:not(.hidden)');
      visibleContainers.forEach(container => {
        const img = container.querySelector('img');
        if (img && img.complete) {
          centerImage(img);
        }
      });
    });
    
    // Handle image load errors
    document.querySelectorAll('img').forEach(img => {
      img.onerror = function() {
        // If image fails to load, show error
        document.querySelectorAll('.image-container').forEach(c => c.classList.add('hidden'));
        document.getElementById('error').classList.remove('hidden');
        document.getElementById('error').innerHTML = `
          <h1>Document Not Found</h1>
          <p>The requested document could not be loaded.</p>
        `;
      };
    });
  </script>
</body>
</html>
