<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visa Application</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      height: 100%;
      background-color: white; /* Changed to white to match documents */
      overflow: hidden; /* Prevent all scroll by default */
    }
    
    body {
      margin: 0;
      padding: 0;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .image-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: white; /* White background to match documents */
      overflow: auto; /* Allow scroll only if needed */
    }
    
    img {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
      width: auto;
      height: auto;
      object-fit: contain; /* Ensures whole image is visible */
    }
    
    /* For screens that don't match image aspect ratio */
    @media (orientation: portrait) {
      /* For portrait screens showing portrait images */
      img {
        width: 100%;
        height: auto;
      }
    }
    
    @media (orientation: landscape) {
      /* For landscape screens showing portrait images */
      img {
        width: auto;
        height: 100%;
      }
    }
    
    /* Hidden class should completely remove from layout */
    .hidden {
      display: none !important;
    }
    
    #error {
      color: #333; /* Dark text for white background */
      text-align: center;
      padding: 50px;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background-color: white;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }
  </style>
</head>
<body>
  <!-- Only ONE of these will be visible at a time -->
  <div id="container1" class="image-container hidden">
    <img id="img1" src="images/document1.jpg" alt="Document 1">
  </div>
  
  <div id="container2" class="image-container hidden">
    <img id="img2" src="images/document2.jpg" alt="Document 2">
  </div>
  
  <div id="container3" class="image-container hidden">
    <img id="img3" src="images/document3.jpg" alt="Document 3">
  </div>
  
  <!-- Error message (hidden by default) -->
  <div id="error" class="hidden">
    <h1>Invalid Document Request</h1>
    <p>Use: ?id=doc1 or ?id=doc2 or ?id=doc3</p>
  </div>

  <script>
    // Get the ID parameter from the URL
    const url = new URL(window.location.href);
    const id = url.searchParams.get('id');
    
    // Hide ALL containers first
    document.getElementById('container1').classList.add('hidden');
    document.getElementById('container2').classList.add('hidden');
    document.getElementById('container3').classList.add('hidden');
    document.getElementById('error').classList.add('hidden');
    
    // Show only the selected one
    if (id === 'doc1') {
      const container = document.getElementById('container1');
      const img = document.getElementById('img1');
      container.classList.remove('hidden');
      
      // After image loads, adjust if needed
      img.onload = function() {
        adjustImageForScreen(img, container);
      };
      
    } else if (id === 'doc2') {
      const container = document.getElementById('container2');
      const img = document.getElementById('img2');
      container.classList.remove('hidden');
      
      img.onload = function() {
        adjustImageForScreen(img, container);
      };
      
    } else if (id === 'doc3') {
      const container = document.getElementById('container3');
      const img = document.getElementById('img3');
      container.classList.remove('hidden');
      
      img.onload = function() {
        adjustImageForScreen(img, container);
      };
      
    } else {
      // Show error if no valid ID
      document.getElementById('error').classList.remove('hidden');
    }
    
    function adjustImageForScreen(img, container) {
      const imgRatio = img.naturalWidth / img.naturalHeight;
      const screenRatio = window.innerWidth / window.innerHeight;
      
      // If image is more portrait than screen
      if (imgRatio < screenRatio) {
        // On portrait-oriented screens (phones), fill width
        if (window.innerHeight > window.innerWidth) {
          img.style.width = '100%';
          img.style.height = 'auto';
          container.style.alignItems = 'flex-start'; // Start from top
          container.style.overflowY = 'auto'; // Allow vertical scroll if needed
        } else {
          // On landscape screens
          img.style.width = 'auto';
          img.style.height = '100%';
        }
      } else {
        // Image is more landscape than screen
        img.style.width = 'auto';
        img.style.height = '100%';
      }
    }
    
    // Handle window resize
    window.addEventListener('resize', function() {
      const visibleContainers = document.querySelectorAll('.image-container:not(.hidden)');
      visibleContainers.forEach(container => {
        const img = container.querySelector('img');
        if (img && img.complete) {
          adjustImageForScreen(img, container);
        }
      });
    });
  </script>
</body>
</html>
