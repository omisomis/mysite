<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visa Application</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black; /* irrelevant, never visible */
    }

    body {
      position: relative;
    }

    .image-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
    }

    img {
      width: 100vw;
      height: 100vh;
      object-fit: cover; /* THIS is the key */
      display: block;
    }

    .hidden {
      display: none !important;
    }

    #error {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      font-family: Arial, sans-serif;
      background: white;
      color: #333;
    }
  </style>
</head>

<body>

  <div id="container1" class="image-container hidden">
    <img src="images/document1.jpg" alt="Document 1">
  </div>

  <div id="container2" class="image-container hidden">
    <img src="images/document2.jpg" alt="Document 2">
  </div>

  <div id="container3" class="image-container hidden">
    <img src="images/document3.jpg" alt="Document 3">
  </div>

  <div id="error" class="hidden">
    <h1>Invalid Document Request</h1>
    <p>Use: ?id=doc1 or ?id=doc2 or ?id=doc3</p>
  </div>

  <script>
    const id = new URLSearchParams(window.location.search).get('id');

    document.querySelectorAll('.image-container, #error')
      .forEach(el => el.classList.add('hidden'));

    if (id === 'doc1') {
      container1.classList.remove('hidden');
    } else if (id === 'doc2') {
      container2.classList.remove('hidden');
    } else if (id === 'doc3') {
      container3.classList.remove('hidden');
    } else {
      error.classList.remove('hidden');
    }
  </script>

</body>
</html>
