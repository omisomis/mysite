<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visa Application</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      height: 100%;
      background-color: #000;
      overflow-x: hidden; /* Prevent horizontal scroll */
    }
    
    body {
      margin: 0;
      padding: 0;
      position: relative;
    }
    
    .image-wrapper {
      width: 100vw; /* Full viewport width */
      min-height: 100vh; /* At least full viewport height */
      display: flex;
      flex-direction: column;
      justify-content: flex-start; /* Start from top */
      align-items: center;
      background-color: #000;
    }
    
    img {
      width: 100%; /* Fill entire width of screen */
      height: auto; /* Maintain aspect ratio */
      display: block;
    }
    
    /* Hidden class should completely remove from layout */
    .hidden {
      display: none !important;
    }
    
    #error {
      color: white;
      text-align: center;
      padding: 50px;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background-color: #000;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }
  </style>
</head>
<body>
  <!-- Only ONE of these will be visible at a time -->
  <div id="wrapper1" class="image-wrapper hidden">
    <img id="img1" src="images/document1.jpg" alt="Document 1">
  </div>
  
  <div id="wrapper2" class="image-wrapper hidden">
    <img id="img2" src="images/document2.jpg" alt="Document 2">
  </div>
  
  <div id="wrapper3" class="image-wrapper hidden">
    <img id="img3" src="images/document3.jpg" alt="Document 3">
  </div>
  
  <!-- Error message (hidden by default) -->
  <div id="error" class="hidden">
    <h1>Invalid Document Request</h1>
    <p>Use: ?id=doc1 or ?id=doc2 or ?id=doc3</p>
  </div>

  <script>
    // Get the ID parameter from the URL
    const url = new URL(window.location.href);
    const id = url.searchParams.get('id');
    
    // Hide ALL containers first
    document.getElementById('wrapper1').classList.add('hidden');
    document.getElementById('wrapper2').classList.add('hidden');
    document.getElementById('wrapper3').classList.add('hidden');
    document.getElementById('error').classList.add('hidden');
    
    // Show only the selected one
    if (id === 'doc1') {
      document.getElementById('wrapper1').classList.remove('hidden');
    } else if (id === 'doc2') {
      document.getElementById('wrapper2').classList.remove('hidden');
    } else if (id === 'doc3') {
      document.getElementById('wrapper3').classList.remove('hidden');
    } else {
      // Show error if no valid ID
      document.getElementById('error').classList.remove('hidden');
    }
    
    // Prevent any horizontal scroll
    window.addEventListener('load', function() {
      document.body.style.overflowX = 'hidden';
    });
  </script>
</body>
</html>
